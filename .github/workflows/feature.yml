name: Feature Pipeline

on:
  push:
    branches: [feature/*]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build da aplicacao
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: target/*.jar

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes automatizados
        run: mvn test --no-transfer-progress

  sonar:
    name: Analise do SonarQube
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Regenera o relatorio do Jacoco (nao reaproveita o artefato do job
      # "test" porque cada job roda num runner limpo) antes de mandar pro
      # Sonar. Gate: cobertura de codigo novo >= 80% ("Sonar way", padrao de
      # fabrica -- ver ADR-004). sonar.qualitygate.wait=true bloqueia o
      # step (e por consequencia a criacao do PR) se o gate reprovar.
      - name: Rodar testes e analise do Sonar
        run: |
          mvn test sonar:sonar --no-transfer-progress \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.scanner.skipJreProvisioning=true

  create-pr:
    name: Criar PR para Main
    runs-on: ubuntu-latest
    needs: sonar
    if: always() && needs.sonar.result != 'failure'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Criar Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR ja existe para branch $BRANCH"
          else
            gh pr create \
              --title "Merge $BRANCH para main" \
              --body "PR criado automaticamente pela pipeline apos build, testes e analise do Sonar passarem." \
              --base main \
              --head "$BRANCH"
            echo "PR criado com sucesso."
          fi
