name: Main Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: eks-mechanical-hub
  ECR_REPOSITORY: mechanical-hub-core-service
  DB_INSTANCE_IDENTIFIER: mechanical-hub-core-service-db

jobs:
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem Docker
        run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      - name: Tag da imagem
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Push da imagem para o ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy EKS
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Descobrir endpoint do RDS
        id: rds
        run: |
          DB_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.DB_INSTANCE_IDENTIFIER }} \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT

      - name: Aplicar namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Aplicar ConfigMap
        env:
          DB_HOST: ${{ steps.rds.outputs.db_host }}
        run: envsubst < k8s/configmap.yaml | kubectl apply -f -

      - name: Aplicar Secrets
        env:
          DB_PASSWORD: ${{ secrets.CORE_SERVICE_DB_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: envsubst < k8s/secret.yaml | kubectl apply -f -

      - name: Aplicar Deployment
        env:
          ECR_REPOSITORY_URL: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: envsubst < k8s/deployment.yaml | kubectl apply -f -

      - name: Reiniciar rollout (garante que ConfigMap/Secrets atualizados sejam aplicados)
        run: kubectl rollout restart deployment/core-service -n core-service

      - name: Aplicar Service
        run: kubectl apply -f k8s/service.yaml

      - name: Aplicar HPA
        run: kubectl apply -f k8s/hpa.yaml

      - name: Verificar deploy
        run: kubectl rollout status deployment/core-service -n core-service --timeout=300s
