spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

logging:
  level:
    root: WARN
    com.fiap.mechanical_hub.core_service: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  statsd:
    metrics:
      export:
        flavor: datadog
        host: ${DD_AGENT_HOST:localhost}
        port: 8125

api:
  security:
    jwt:
      secret: ${JWT_SECRET}
